# systemd drop-in — resource caps for ndlaw-mcp.service on a small
# droplet with a PUBLIC endpoint (ndlaw.org). The kernel throttles the
# service at MemoryHigh and kills it at MemoryMax; Restart=on-failure in
# the base unit brings it back in ~2s. This turns a pathological query
# burst into a brief service blip instead of a droplet-wide OOM.
#
# Install:
#   sudo mkdir -p /etc/systemd/system/ndlaw-mcp.service.d
#   sudo cp deploy/ndlaw-mcp-resources.conf \
#       /etc/systemd/system/ndlaw-mcp.service.d/resources.conf
#   sudo systemctl daemon-reload && sudo systemctl restart ndlaw-mcp
#
# Sizing (1 GiB droplet shared with Apache/DokuWiki): the app idles ~20 MB
# RSS; SQLite page cache + FTS scratch on the heaviest tools stays well
# under 200 MB. 300/450 leaves the wiki's prefork pool room to breathe.

[Service]
MemoryHigh=300M
MemoryMax=450M
TasksMax=64

# Server-wide cap on concurrent tool calls (ndlaw_mcp/concurrency.py) — the
# capacity guard that per-IP fail2ban cannot be, since AI providers' shared
# egress ranges are exempt from the jails. Sized 2026-10-15 by a one-core
# load test: throughput flattens at 4-8 in flight; RSS grows ~20 MB per call
# and crosses MemoryHigh=300M near 16. Overflow calls wait up to 2 s, then
# get an "at capacity, retry" tool result.
Environment=NDLAW_MAX_INFLIGHT=6
