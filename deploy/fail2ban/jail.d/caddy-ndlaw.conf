# fail2ban jail — ban IPs that repeatedly fail Basic Auth.
# Install to /etc/fail2ban/jail.d/caddy-ndlaw.conf, then:
#   sudo systemctl restart fail2ban
#
# Uses fail2ban's default ban action (nftables/iptables), which coexists
# with ufw. Check status with:  sudo fail2ban-client status caddy-ndlaw

[caddy-ndlaw]
enabled  = true
port     = http,https
filter   = caddy-ndlaw
logpath  = /var/log/caddy/ndlaw-mcp.log
maxretry = 5
findtime = 10m
bantime  = 1h
