# fail2ban jail for the Apache capability-URL deployment (no basic auth).
# Install to /etc/fail2ban/jail.d/apache-mcp.conf, adjust logpath to your
# vhost's access log, then:  sudo systemctl restart fail2ban
#
# One layer:
#   apache-mcp-junk  — scanners/bots: refused requests (400/403/404/408).
#                      They never have the secret path, so they only ever
#                      produce these.
#
# There is deliberately NO rate cap on authorized traffic. Holding the secret
# URL is the authorization, and the court users who hold it share NAT egress
# IPs (and, via claude.ai, share Anthropic's egress IPs with each other), so
# any per-IP cap is collective punishment. mcp-apache.conf implements the
# exemption structurally: requests Apache authorizes are tagged `ndlaw_client`
# and logged to -client.log, which this logpath glob does not match. The
# retired [apache-mcp-rate] stanza matched 2xx only and became unreachable
# under that split — everything left in -access.log is a 403 (2026-08-03).
#
# maxretry is 30, not 10. The tag in mcp-apache.conf enumerates the MCP
# client's connection-setup probes (.well-known/oauth-*, /register); a future
# client revision probing some new root path would land back here, and at 10
# that costs a shared egress IP six hours. Scanners emit far more than 30.
#
# `backend = auto` is REQUIRED and not decorative. Debian ships
# /etc/fail2ban/jail.d/defaults-debian.conf with `backend = systemd` under
# [DEFAULT], which applies to every jail that does not override it. A jail
# left on the systemd backend ignores logpath entirely and monitors the
# journal — `fail2ban-client status` then shows "Journal matches:" instead of
# a File list, and `get <jail> logpath` reports "No file is currently
# monitored". It fails silently and open: no errors, no bans, ever. Verified
# on the live host 2026-08-03 by installing this file without the line.
#
# Check status:  sudo fail2ban-client status apache-mcp-junk
#                (confirm it prints "File list:", not "Journal matches:")
# Unban an IP:   sudo fail2ban-client set apache-mcp-junk unbanip <IP>

[apache-mcp-junk]
enabled  = true
port     = http,https
backend  = auto
filter   = apache-mcp-junk
logpath  = /var/log/apache2/mcp.*-access.log
maxretry = 30
findtime = 10m
bantime  = 6h
