# fail2ban filter — counts SUCCESSFUL (2xx) requests to the Apache MCP
# vhost, so the paired jail acts as a per-IP request-rate cap on real
# traffic (clients that have the URL). Junk never matches here; it is
# handled by apache-mcp-junk.
# Install to /etc/fail2ban/filter.d/apache-mcp-rate.conf
#
# The bracket group is [^\]]* and NOT [^\]]+: fail2ban strips the date from
# INSIDE the brackets before applying failregex, so the line this matches
# actually reads `1.2.3.4 - - [] "GET ...`. With + the group needs at least one
# character and finds `]` immediately, so the regex never matches. Verified
# against the live ndlaw.org log 2026-08-01: every Apache filter here reported
# "238 lines, 0 matched" until this was corrected. Bisect that found it:
# `^<HOST> \S+ \S+ \[` matched 238, adding `[^\]]+\] "` dropped it to 0.

[Definition]
failregex = ^<HOST> \S+ \S+ \[[^\]]*\] "[^"]*" 2\d\d \d+
ignoreregex =
