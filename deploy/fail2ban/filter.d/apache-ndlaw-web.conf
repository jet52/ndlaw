# fail2ban filter — successful (2xx/3xx) GET/HEAD requests to the citation-URL
# web interface on ndlaw.org (PLAN-web-interface.md §7). Matches only the
# content namespaces the vhost proxies; /mcp, the landing page, and robots.txt
# deliberately do NOT match, so the paired jails throttle only page reading.
# 404 floods from URL guessing are already covered by apache-ndlaw-junk.
# Install to /etc/fail2ban/filter.d/apache-ndlaw-web.conf

[Definition]
failregex = ^<HOST> \S+ \S+ \[[^\]]+\] "(?:GET|HEAD) /(?:(?:cite|ndcc|const|rule|ndac|ag|jeac|ND|NW|NW2d)(?:/[^" ]*)?|[0-9]{4}[Nn][Dd][^" ]*) [^"]*" [23]\d\d \d+
ignoreregex =
