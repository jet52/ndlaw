# fail2ban filter — successful (2xx/3xx) GET/HEAD requests to the citation-URL
# web interface on ndlaw.org (PLAN-web-interface.md §7). /mcp, the landing
# page, and robots.txt deliberately do NOT match, so the paired jails throttle
# only page reading. 404 floods from URL guessing are already covered by
# apache-ndlaw-junk.
#
# Mirrors the vhost's ProxyPassMatch exclusion list — the two must name the
# same URL surface. When that regex enumerated content namespaces, this one
# did too, and both missed the short citation URLs (/ndrappp4,
# /ndcc12.1-20-03): the vhost 404'd them at Apache, and had it not, this
# filter would have let an unlimited number of them through untracked.
#
# The path is always followed by " HTTP/1.1", so the exclusions anchor on
# [/ ]; "GET / " cannot match because [^" ]+ needs at least one character
# after the leading slash.
# Install to /etc/fail2ban/filter.d/apache-ndlaw-web.conf
#
# The bracket group is [^\]]* and NOT [^\]]+: fail2ban strips the date from
# INSIDE the brackets before applying failregex, so the line this matches
# actually reads `1.2.3.4 - - [] "GET ...`. With + the group needs at least one
# character and finds `]` immediately, so the regex never matches. Verified
# against the live ndlaw.org log 2026-08-01: every Apache filter here reported
# "238 lines, 0 matched" under fail2ban-regex until this was corrected. Bisect
# that found it: `^<HOST> \S+ \S+ \[` matched 238, adding `[^\]]+\] "`
# dropped it to 0.
#
# CORRECTION 2026-08-02: do NOT read that as "these filters never banned
# anything." apache-ndlaw-junk banned two IPs on 2026-07-30 with the `+` form,
# so the daemon matched lines fail2ban-regex said it could not. The two disagree
# about date handling under some condition not pinned down here. `*` matches the
# line whether or not the date has been stripped, so it is correct either way and
# strictly a superset of `+` — which is why this change is still right. What is
# NOT established is how much protection was actually missing beforehand.

[Definition]
failregex = ^<HOST> \S+ \S+ \[[^\]]*\] "(?:GET|HEAD) /(?!(?:mcp|static|robots\.txt|favicon\.ico|index\.html)(?:[/ ]))[^" ]+ [^"]*" [23]\d\d \d+
ignoreregex =
