# Apache 2.4 vhost for ndlaw-mcp on a dedicated subdomain.
# Use when an existing Apache install is already fronting :80/:443 and you
# want to add an MCP endpoint without disturbing it.
#
# Access model: capability URL (secret path). The opinion data is public
# (CC0), so the unguessable path segment is access control against bots and
# scrapers, not secrecy. No per-user credentials; share the full URL:
#
#     https://MCP_HOST/MCP_TOKEN/mcp
#
# Everything outside /MCP_TOKEN/ returns 403 from Apache without touching
# the app. Pair with deploy/fail2ban/ (apache-mcp-junk): token-less probes
# get banned on repeated 4xx.
#
# Traffic that reaches the app through the secret path is NOT rate-limited,
# by design — holding the URL is the authorization. The two CustomLogs below
# implement that: authorized requests are tagged `ndlaw_client` and written
# to -client.log, which no jail reads. See the note above them.
#
# Install:
#   1. Generate a token and render the file (the rendered file is what
#      Apache reads — the token lives ONLY on the server, never in git):
#        TOKEN=$(openssl rand -base64 24 | tr -dc 'a-zA-Z0-9' | head -c 28)
#        sudo sed -e "s/MCP_HOST/mcp.example.com/g" -e "s/MCP_TOKEN/$TOKEN/g" \
#          deploy/mcp-apache.conf | sudo tee /etc/apache2/sites-available/mcp.example.com.conf
#   2. Enable required modules (idempotent):
#        sudo a2enmod proxy proxy_http headers ssl rewrite
#   3. Enable the site and reload Apache (the :443 block is guarded by
#      <IfFile>, so Apache starts cleanly before the cert exists):
#        sudo a2ensite mcp.example.com
#        sudo systemctl reload apache2
#   4. Issue the TLS cert. --apache uses HTTP-01 over the :80 vhost below:
#        sudo certbot certonly --apache -d mcp.example.com
#        sudo systemctl reload apache2
#   5. Install the fail2ban jails (see deploy/fail2ban/jail.d/apache-mcp.conf).
#
# Rotate access: change the token in the rendered conf, reload Apache, and
# re-share the URL. Cert renewal: certbot's systemd timer handles it.

<VirtualHost *:80>
    ServerName MCP_HOST

    # Keep /.well-known/acme-challenge/ reachable for cert renewal; redirect
    # everything else to HTTPS.
    RewriteEngine on
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

# The :443 block activates only after certbot has populated the cert files.
# This lets `a2ensite` + reload succeed on a fresh install before step 4.
<IfFile "/etc/letsencrypt/live/MCP_HOST/fullchain.pem">
<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName MCP_HOST

    ErrorLog  ${APACHE_LOG_DIR}/MCP_HOST-error.log

    # Split the access log by the `ndlaw_client` tag set below. fail2ban has
    # no notion of URLs or authorized users — a jail is a logfile plus a
    # regex plus a counter — so the only categorical way to exempt the secret
    # path from banning is to keep it out of the file the jails read. The
    # jails' logpath glob is mcp.*-access.log, which does NOT match
    # -client.log. Debian logrotate covers /var/log/apache2/*.log, so the
    # second file rotates with no extra config.
    CustomLog ${APACHE_LOG_DIR}/MCP_HOST-client.log combined env=ndlaw_client
    CustomLog ${APACHE_LOG_DIR}/MCP_HOST-access.log combined env=!ndlaw_client

    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile    /etc/letsencrypt/live/MCP_HOST/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/MCP_HOST/privkey.pem

    # --- Reverse proxy, reachable ONLY under the secret path ---
    ProxyRequests Off
    ProxyPreserveHost On
    ProxyTimeout 120

    # Deny everything by default (403 at Apache; the app never sees it),
    # then re-open just the token path. Later <Location> wins on overlap.
    <Location />
        Require all denied
    </Location>

    <Location /MCP_TOKEN/>
        Require all granted

        # Tag every request Apache authorizes here, so the set of ban-exempt
        # requests is by construction identical to the set of allowed ones.
        # Keep this on the <Location> and not on a SetEnvIf path regex: a
        # second copy of the token could drift from this one, and a
        # status-code-keyed rule would miss the app's own 4xx — FastMCP
        # returns 404 on the secret path for a stale mcp-session-id, and
        # those are legitimate court traffic.
        SetEnv ndlaw_client 1

        ProxyPass        http://127.0.0.1:8000/ flushpackets=on
        ProxyPassReverse http://127.0.0.1:8000/

        # MCP can return text/event-stream; defeat buffering & compression
        # so SSE chunks reach the client as they're produced.
        SetEnv proxy-sendchunked 1
        RequestHeader unset Accept-Encoding
        Header set X-Accel-Buffering "no"
    </Location>

    # MCP clients probe these at the vhost root during connection setup:
    # OAuth protected-resource and authorization-server metadata (RFC 9728 /
    # RFC 8414) and dynamic client registration (RFC 7591).
    #
    # They MUST answer 404, not 403. Under the MCP authorization spec a 404
    # on protected-resource metadata means "this server has no OAuth — proceed
    # unauthenticated," while a 403 is an authorization *failure*: the client
    # concludes auth is required and it was refused, escalates to POST
    # /register, gets 403 again, and aborts with a connection error. The
    # <Location /> deny-all answers 403, so without this the endpoint is
    # unusable from any client that probes discovery before connecting
    # (observed on Windows via a claude.ai connector, 2026-08-03).
    #
    # SetEnvIf, not a <LocationMatch> SetEnv: mod_alias resolves RedirectMatch
    # in the translate phase, which can bypass the location walk and leave the
    # tag unset. SetEnvIf runs per-request before both. Using it here does not
    # reintroduce the token-drift risk argued against above — these paths carry
    # no token.
    #
    # Tagging matters independently of the status code: three or four of these
    # per connection was enough to trip apache-mcp-junk off two connections and
    # ban a whole shared egress IP for six hours (observed on Anthropic's
    # claude.ai egress, 2026-08-03).
    SetEnvIf Request_URI "^/(?:\.well-known/oauth-|register$)" ndlaw_client=1
    RedirectMatch 404 "^/(?:\.well-known/oauth-|register$)"

    # Cap request bodies — JSON-RPC payloads are tiny.
    LimitRequestBody 262144
</VirtualHost>
</IfModule>
</IfFile>

# vim: syntax=apache ts=4 sw=4 sts=4 sr noet
